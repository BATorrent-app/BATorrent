name: i18n parity

# Required fast gate (see docs/CI.md): locale key parity, duplicate keys, and
# i18n.t()/tr_() usage. Pure Python — no Qt/build. Also runs inside build.yml
# (test job) and qml-smoke.yml; this workflow exists so translation-only PRs
# fail in seconds without a full rebuild.

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'translations/**'
      - 'scripts/check-i18n-parity.py'
      - '.github/workflows/i18n.yml'
      - 'src/**/*.qml'
      - 'src/**/*.cpp'
      - 'src/**/*.h'
  pull_request:
    paths:
      - 'translations/**'
      - 'scripts/check-i18n-parity.py'
      - '.github/workflows/i18n.yml'
      - 'src/**/*.qml'
      - 'src/**/*.cpp'
      - 'src/**/*.h'

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: i18n parity + duplicates + key usage
        run: python3 scripts/check-i18n-parity.py
