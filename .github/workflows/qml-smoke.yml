name: QML Smoke

# Required UI gate (see docs/CI.md). Catches QML type/load errors the C++ build
# cannot see: boot the real binary offscreen and fail on engine/QML errors.
# Also runs Qt Quick Test (tests/qml/tst_*) for Watch/Search/library journeys.
#
# PR coverage: called from build.yml (do not add pull_request here — doubles every PR).
# Push to main: path-filtered so docs/Actions-only commits skip this rebuild.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'translations/**'
      - 'tests/qml/**'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/qml-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  boot-offscreen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.7.*'
          modules: qtmultimedia
          cache: true
      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # latest
        with:
          packages: cmake g++ libtorrent-rasterbar-dev libboost-dev libssl-dev libgl-dev libglx-dev libegl-dev
          version: 3.0
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc) --target BATorrent
      - name: Boot offscreen and scan for QML errors
        run: |
          # BAT_SMOKE_LOADERS activates deferred window Loaders once so type
          # errors in RssWindow / WrappedWindow / etc. surface here.
          QT_QPA_PLATFORM=offscreen BAT_QML_STRICT=warn BAT_SMOKE_LOADERS=1 \
            timeout 35 ./build/BATorrent > boot.log 2>&1 || true
          echo "=== boot log (tail) ==="; tail -40 boot.log
          # Engine-level load failures are always fatal; QML runtime errors are
          # matched by pattern. Extend the list when a new class escapes.
          if grep -Eq "failed to load component|is not a type|TypeError:|ReferenceError:|Unable to assign|Invalid property assignment|Cannot specify .* anchors for items inside|is instantiated recursively" boot.log; then
            echo "::error::QML errors at boot"; grep -En "failed to load component|is not a type|TypeError:|ReferenceError:|Unable to assign|Invalid property assignment|Cannot specify|instantiated recursively" boot.log | head -20
            exit 1
          fi
          # Catch missing translation keys that only surface as empty UI copy.
          python3 scripts/check-i18n-parity.py
          echo "boot clean"

  quick-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.7.*'
          modules: qtmultimedia
          cache: true
      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # latest
        with:
          packages: cmake g++ libtorrent-rasterbar-dev libboost-dev libssl-dev libgl-dev libglx-dev libegl-dev
          version: 3.0
      - name: Build Qt Quick Test
        run: |
          # test_qml links app resources.qrc only (no Catch2 COMMON_SOURCES).
          cmake -B build-qml -DBAT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-qml -j$(nproc) --target test_qml
      - name: Run Watch / Search / widget Quick Tests
        run: |
          QT_QPA_PLATFORM=offscreen ./build-qml/tests/test_qml
