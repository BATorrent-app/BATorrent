name: Semgrep

# SAST upload to code scanning. Weekly / manual / label `ci-deep` — not a PR gate.

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci-deep'
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config=p/cpp --config=p/security-audit \
            --sarif --output=semgrep.sarif --metrics=off src/ || true

      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
