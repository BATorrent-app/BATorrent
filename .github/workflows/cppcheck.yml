name: cppcheck

# Fast static analysis, but currently noisy (Qt stream false positives). Not a
# PR gate — weekly / manual / label `ci-deep` until the suppressions settle.

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  cppcheck:
    name: cppcheck static analysis
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci-deep'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          # Gate on the high-confidence "error" severity (null derefs, leaks,
          # buffer overruns, UB). Style/perf noise is not failed on.
          # uninitStructMember on QDataStream >> into a default-constructed
          # struct is a known false positive in the IPC serializers.
          cppcheck --quiet --std=c++17 --library=qt \
            --inline-suppr --suppress=missingInclude --suppress=missingIncludeSystem \
            --suppress=uninitStructMember:src/ipc/ipcserialize.h \
            --error-exitcode=1 -I src \
            src/app src/torrent src/bridges src/services src/webui src/ipc
