name: OSV-Scanner

# Dependency vulnerability scan. Weekly / manual / label `ci-deep` — not a PR gate.
# Actions-only Dependabot bumps do not need this on every PR.

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  scan:
    name: OSV vulnerability scan
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci-deep'
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install OSV-Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner

      - name: Scan
        run: ./osv-scanner scan --recursive --format sarif --output osv.sarif . || true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ hashFiles('osv.sarif') != '' }}
        with:
          sarif_file: osv.sarif
